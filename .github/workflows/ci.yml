name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  check:
    strategy:
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-ios
          - os: macos-latest
            target: aarch64-apple-ios-sim
          - os: ubuntu-latest
            target: aarch64-linux-android
          - os: ubuntu-latest
            target: wasm32-unknown-unknown

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
      
      - name: Install ALSA (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pkg-config libasound2-dev

      - name: Install GStreamer (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev \
            libgstreamer-plugins-bad1.0-dev \
            gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-bad \
            gstreamer1.0-plugins-ugly \
            gstreamer1.0-libav \
            libgstrtspserver-1.0-dev \
            libges-1.0-dev
      
      - name: Install GStreamer (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          brew install gstreamer pkgconf
          echo "PKG_CONFIG_PATH=$(brew --prefix gstreamer)/lib/pkgconfig" >> "$GITHUB_ENV"

      - name: Install GStreamer (Windows GNU)
        if: matrix.target == 'x86_64-pc-windows-gnu'
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: |
            mingw-w64-x86_64-glib2
            mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-gstreamer
            mingw-w64-x86_64-gst-plugins-base
            mingw-w64-x86_64-gst-plugins-good
            mingw-w64-x86_64-gst-plugins-bad
            mingw-w64-x86_64-gst-plugins-ugly
            mingw-w64-x86_64-gst-libav
            mingw-w64-x86_64-gst-rtsp-server

      - name: Fix GStreamer Paths (Windows GNU)
        if: matrix.target == 'x86_64-pc-windows-gnu'
        shell: pwsh
        env:
          MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          $pkg = "$env:MSYS2_LOCATION\mingw64\bin\pkg-config.exe"
          if (!(Test-Path $pkg)) {
            throw "pkg-config not found at $pkg"
          }
          "PKG_CONFIG=$pkg" >> $env:GITHUB_ENV
          "PKG_CONFIG_PATH=$env:MSYS2_LOCATION\mingw64\lib\pkgconfig" >> $env:GITHUB_ENV
          "$env:MSYS2_LOCATION\mingw64\bin" >> $env:GITHUB_PATH

      - name: Install GStreamer (Windows MSVC)
        if: matrix.target == 'x86_64-pc-windows-msvc'
        shell: pwsh
        run: |
          $url = "https://gstreamer.freedesktop.org/data/pkg/windows/1.0.0/msvc/"
          Write-Host "Download the matching GStreamer MSVC runtime and development installers from:"
          Write-Host $url

      - name: Fix GStreamer Paths (Windows MSVC)
        if: matrix.target == 'x86_64-pc-windows-msvc'
        shell: pwsh
        run: |
          $gst = "C:\gstreamer\1.0\msvc_x86_64"
          "PKG_CONFIG=$gst\bin\pkg-config.exe" >> $env:GITHUB_ENV
          "PKG_CONFIG_PATH=$gst\lib\pkgconfig" >> $env:GITHUB_ENV
          "$gst\bin" >> $env:GITHUB_PATH

      - uses: dtolnay/rust-toolchain@stable  
        with:
          targets: ${{ matrix.target }}

      - run: cargo check --all-features --target ${{ matrix.target }}

  clippy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      
      - name: Install ALSA
        run: sudo apt-get update && sudo apt-get install -y pkg-config libasound2-dev
      
      - name: Install GStreamer
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev \
            libgstreamer-plugins-bad1.0-dev \
            gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-bad \
            gstreamer1.0-plugins-ugly \
            gstreamer1.0-libav \
            libgstrtspserver-1.0-dev \
            libges-1.0-dev

      - uses: dtolnay/rust-toolchain@stable

      - run: cargo clippy --all-targets --all-features -- -D warnings

  fmt:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      
      - name: Install ALSA
        run: sudo apt-get update && sudo apt-get install -y pkg-config libasound2-dev
      
      - name: Install GStreamer
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev \
            libgstreamer-plugins-bad1.0-dev \
            gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-bad \
            gstreamer1.0-plugins-ugly \
            gstreamer1.0-libav \
            libgstrtspserver-1.0-dev \
            libges-1.0-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - run: cargo fmt --all -- --check

  docs:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      
      - name: Install ALSA
        run: sudo apt-get update && sudo apt-get install -y pkg-config libasound2-dev
      
      - name: Install GStreamer
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev \
            libgstreamer-plugins-bad1.0-dev \
            gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-bad \
            gstreamer1.0-plugins-ugly \
            gstreamer1.0-libav \
            libgstrtspserver-1.0-dev \
            libges-1.0-dev

      - uses: dtolnay/rust-toolchain@stable

      - run: RUSTDOCFLAGS="-D warnings" cargo doc --all-features --no-deps
  
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      
      - name: Install ALSA
        run: sudo apt-get update && sudo apt-get install -y pkg-config libasound2-dev
      
      - name: Install GStreamer
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev \
            libgstreamer-plugins-bad1.0-dev \
            gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-bad \
            gstreamer1.0-plugins-ugly \
            gstreamer1.0-libav \
            libgstrtspserver-1.0-dev \
            libges-1.0-dev

      - uses: dtolnay/rust-toolchain@stable

      - run: cargo test --all-features

  examples:
    strategy:
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-ios-sim
          - os: ubuntu-latest
            target: aarch64-linux-android
          - os: ubuntu-latest
            target: wasm32-unknown-unknown

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
      
      - name: Install ALSA (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y pkg-config libasound2-dev
      
      - name: Install GStreamer (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev \
            libgstreamer-plugins-bad1.0-dev \
            gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-bad \
            gstreamer1.0-plugins-ugly \
            gstreamer1.0-libav \
            libgstrtspserver-1.0-dev \
            libges-1.0-dev
      
      - name: Install GStreamer (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          brew install gstreamer pkgconf
          echo "PKG_CONFIG_PATH=$(brew --prefix gstreamer)/lib/pkgconfig" >> "$GITHUB_ENV"

      - name: Install GStreamer (Windows MSVC)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $url = "https://gstreamer.freedesktop.org/data/pkg/windows/1.0.0/msvc/"
          Write-Host "Download the matching GStreamer MSVC runtime and development installers from:"
          Write-Host $url

      - name: Fix GStreamer Paths (Windows MSVC)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $gst = "C:\gstreamer\1.0\msvc_x86_64"
          "PKG_CONFIG=$gst\bin\pkg-config.exe" >> $env:GITHUB_ENV
          "PKG_CONFIG_PATH=$gst\lib\pkgconfig" >> $env:GITHUB_ENV
          "$gst\bin" >> $env:GITHUB_PATH

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Android NDK
        if: matrix.target == 'aarch64-linux-android'
        run: |
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "ndk;27.2.12479018"
          NDK="$ANDROID_SDK_ROOT/ndk/27.2.12479018"
          echo "ANDROID_NDK_HOME=$NDK" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android26-clang" >> "$GITHUB_ENV"

      - name: Build
        run: |
          cargo build -p ball-pit --target ${{ matrix.target }}
          cargo build -p counter --target ${{ matrix.target }}
          cargo build -p readme --target ${{ matrix.target }}
          cargo build -p radio --target ${{ matrix.target }}