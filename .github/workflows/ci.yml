name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

env:
  GST_VERSION: "1.26.10"

jobs:
  check:
    strategy:
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-ios
          - os: macos-latest
            target: aarch64-apple-ios-sim
          - os: ubuntu-latest
            target: aarch64-linux-android
          - os: ubuntu-latest
            target: wasm32-unknown-unknown

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
      
      - name: Install ALSA (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pkg-config libasound2-dev

      - name: Install GStreamer (Linux)
        if: runner.os == 'Linux' && matrix.target != 'aarch64-linux-android'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev \
            libgstreamer-plugins-bad1.0-dev \
            gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-bad \
            gstreamer1.0-plugins-ugly \
            gstreamer1.0-libav \
            libgstrtspserver-1.0-dev \
            libges-1.0-dev

      - name: Cache GStreamer Android SDK
        if: matrix.target == 'aarch64-linux-android'
        id: cache-gst-android
        uses: actions/cache@v4
        with:
          path: ~/gstreamer-android
          key: gstreamer-android-${{ env.GST_VERSION }}

      - name: Install GStreamer (Android)
        if: matrix.target == 'aarch64-linux-android' && steps.cache-gst-android.outputs.cache-hit != 'true'
        run: |
          curl -fL "https://gstreamer.freedesktop.org/data/pkg/android/${{ env.GST_VERSION }}/gstreamer-1.0-android-universal-${{ env.GST_VERSION }}.tar.xz" -o /tmp/gstreamer-android.tar.xz
          mkdir -p "$HOME/gstreamer-android"
          tar xf /tmp/gstreamer-android.tar.xz -C "$HOME/gstreamer-android"

      - name: Set GStreamer Android env
        if: matrix.target == 'aarch64-linux-android'
        run: |
          echo "PKG_CONFIG_ALLOW_CROSS=1" >> "$GITHUB_ENV"
          echo "PKG_CONFIG_LIBDIR=$HOME/gstreamer-android/arm64/lib/pkgconfig" >> "$GITHUB_ENV"
          echo "GSTREAMER_1_0_ROOT_ANDROID=$HOME/gstreamer-android/" >> "$GITHUB_ENV"

      - name: Install GStreamer (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          brew install gstreamer pkgconf
          echo "PKG_CONFIG_PATH=$(brew --prefix gstreamer)/lib/pkgconfig" >> "$GITHUB_ENV"

      - name: Install GStreamer (Windows GNU)
        if: matrix.target == 'x86_64-pc-windows-gnu'
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-glib2
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-gstreamer
            mingw-w64-ucrt-x86_64-gst-plugins-base
            mingw-w64-ucrt-x86_64-gst-plugins-good
            mingw-w64-ucrt-x86_64-gst-plugins-bad
            mingw-w64-ucrt-x86_64-gst-plugins-ugly
            mingw-w64-ucrt-x86_64-gst-libav
            mingw-w64-ucrt-x86_64-gst-rtsp-server
    
      - name: Configure GNU pkg-config
        if: matrix.target == 'x86_64-pc-windows-gnu'
        shell: pwsh
        env:
          MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          $bin = "$env:MSYS2_LOCATION\ucrt64\bin"
          $pkg = "$bin\pkgconf.exe"

          if (!(Test-Path $pkg)) {
            $pkg = "$bin\pkg-config.exe"
          }
          if (!(Test-Path $pkg)) {
            throw "pkg-config/pkgconf not found in $bin"
          }

          "PKG_CONFIG=$pkg" >> $env:GITHUB_ENV
          "PKG_CONFIG_PATH=$env:MSYS2_LOCATION\ucrt64\lib\pkgconfig" >> $env:GITHUB_ENV
          "$bin" >> $env:GITHUB_PATH

      - uses: dtolnay/rust-toolchain@stable  
        with:
          targets: ${{ matrix.target }}

      - run: cargo check --all-features --target ${{ matrix.target }}

  clippy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      
      - name: Install ALSA
        run: sudo apt-get update && sudo apt-get install -y pkg-config libasound2-dev
      
      - name: Install GStreamer
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev \
            libgstreamer-plugins-bad1.0-dev \
            gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-bad \
            gstreamer1.0-plugins-ugly \
            gstreamer1.0-libav \
            libgstrtspserver-1.0-dev \
            libges-1.0-dev

      - uses: dtolnay/rust-toolchain@stable

      - run: cargo clippy --all-targets --all-features -- -D warnings

  fmt:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      
      - name: Install ALSA
        run: sudo apt-get update && sudo apt-get install -y pkg-config libasound2-dev
      
      - name: Install GStreamer
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev \
            libgstreamer-plugins-bad1.0-dev \
            gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-bad \
            gstreamer1.0-plugins-ugly \
            gstreamer1.0-libav \
            libgstrtspserver-1.0-dev \
            libges-1.0-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - run: cargo fmt --all -- --check

  docs:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      
      - name: Install ALSA
        run: sudo apt-get update && sudo apt-get install -y pkg-config libasound2-dev
      
      - name: Install GStreamer
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev \
            libgstreamer-plugins-bad1.0-dev \
            gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-bad \
            gstreamer1.0-plugins-ugly \
            gstreamer1.0-libav \
            libgstrtspserver-1.0-dev \
            libges-1.0-dev

      - uses: dtolnay/rust-toolchain@stable

      - run: RUSTDOCFLAGS="-D warnings" cargo doc --all-features --no-deps
  
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      
      - name: Install ALSA
        run: sudo apt-get update && sudo apt-get install -y pkg-config libasound2-dev
      
      - name: Install GStreamer
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev \
            libgstreamer-plugins-bad1.0-dev \
            gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-bad \
            gstreamer1.0-plugins-ugly \
            gstreamer1.0-libav \
            libgstrtspserver-1.0-dev \
            libges-1.0-dev

      - uses: dtolnay/rust-toolchain@stable

      - run: cargo test --all-features

  examples:
    strategy:
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: ubuntu-latest
            target: aarch64-linux-android
          - os: ubuntu-latest
            target: wasm32-unknown-unknown

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
      
      - name: Install ALSA (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y pkg-config libasound2-dev
      
      - name: Install GStreamer (Linux)
        if: matrix.os == 'ubuntu-latest' && matrix.target != 'aarch64-linux-android'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev \
            libgstreamer-plugins-bad1.0-dev \
            gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-bad \
            gstreamer1.0-plugins-ugly \
            gstreamer1.0-libav \
            libgstrtspserver-1.0-dev \
            libges-1.0-dev

      - name: Cache GStreamer Android SDK
        if: matrix.target == 'aarch64-linux-android'
        id: cache-gst-android
        uses: actions/cache@v4
        with:
          path: ~/gstreamer-android
          key: gstreamer-android-${{ env.GST_VERSION }}

      - name: Install GStreamer (Android)
        if: matrix.target == 'aarch64-linux-android' && steps.cache-gst-android.outputs.cache-hit != 'true'
        run: |
          curl -fL "https://gstreamer.freedesktop.org/data/pkg/android/${{ env.GST_VERSION }}/gstreamer-1.0-android-universal-${{ env.GST_VERSION }}.tar.xz" -o /tmp/gstreamer-android.tar.xz
          mkdir -p "$HOME/gstreamer-android"
          tar xf /tmp/gstreamer-android.tar.xz -C "$HOME/gstreamer-android"

      - name: Set GStreamer Android env
        if: matrix.target == 'aarch64-linux-android'
        run: |
          echo "PKG_CONFIG_ALLOW_CROSS=1" >> "$GITHUB_ENV"
          echo "PKG_CONFIG_LIBDIR=$HOME/gstreamer-android/arm64/lib/pkgconfig" >> "$GITHUB_ENV"
          echo "GSTREAMER_1_0_ROOT_ANDROID=$HOME/gstreamer-android/" >> "$GITHUB_ENV"

      - name: Install GStreamer (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          brew install gstreamer pkgconf
          echo "PKG_CONFIG_PATH=$(brew --prefix gstreamer)/lib/pkgconfig" >> "$GITHUB_ENV"

      - name: Install pkg-config (Windows)
        if: matrix.target == 'x86_64-pc-windows-msvc'
        run: choco install pkgconfiglite -y --no-progress
        shell: pwsh

      - name: Install GStreamer (Windows)
        if: matrix.target == 'x86_64-pc-windows-msvc'
        shell: pwsh
        run: |
          $version = "${{ env.GST_VERSION }}"
          $base = "https://gstreamer.freedesktop.org/data/pkg/windows/$version/msvc"
          $gst = "C:\gstreamer\1.0\msvc_x86_64"

          $packages = @(
            "gstreamer-1.0-msvc-x86_64-$version.msi",
            "gstreamer-1.0-devel-msvc-x86_64-$version.msi"
          )

          foreach ($pkg in $packages) {
            $msiPath = "$env:TEMP\$pkg"
            $logPath = "$env:TEMP\$pkg.log"

            Write-Host "Downloading $pkg..."
            Invoke-WebRequest -Uri "$base/$pkg" -OutFile $msiPath

            Write-Host "Installing $pkg..."
            $proc = Start-Process msiexec.exe -ArgumentList "/i `"$msiPath`" ADDLOCAL=ALL /qn /norestart /l*v `"$logPath`" INSTALLDIR=`"$gst`"" -Wait -PassThru

            if ($proc.ExitCode -ne 0 -and $proc.ExitCode -ne 3010) {
              Write-Host "---- msiexec log tail for $pkg ----"
              if (Test-Path $logPath) {
                Get-Content $logPath -Tail 80
              }
              throw "msiexec failed for $pkg with exit code $($proc.ExitCode)"
            }
          }

          if (!(Test-Path "$gst\lib\pkgconfig\glib-2.0.pc")) {
            Write-Host "Contents of ${gst}:"
            if (Test-Path $gst) {
              Get-ChildItem -Recurse $gst | Select-Object -First 100 | Format-Table FullName
            } else {
              Write-Host "$gst does not exist"
            }
            throw "glib-2.0.pc not found after install"
          }

          "PKG_CONFIG_PATH=$gst\lib\pkgconfig" >> $env:GITHUB_ENV
          "GSTREAMER_1_0_ROOT_MSVC_X86_64=$gst\" >> $env:GITHUB_ENV
          "$gst\bin" >> $env:GITHUB_PATH

      - name: Verify pkg-config can see GStreamer (Windows)
        if: matrix.target == 'x86_64-pc-windows-msvc'
        shell: pwsh
        run: |
          pkg-config --modversion glib-2.0
          if ($LASTEXITCODE -ne 0) {
            throw "pkg-config cannot locate GLib"
          }
          pkg-config --modversion gstreamer-1.0
          if ($LASTEXITCODE -ne 0) {
            throw "pkg-config cannot locate GStreamer"
          }

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Android NDK
        if: matrix.target == 'aarch64-linux-android'
        run: |
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "ndk;27.2.12479018"
          NDK="$ANDROID_SDK_ROOT/ndk/27.2.12479018"
          echo "ANDROID_NDK_HOME=$NDK" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android26-clang" >> "$GITHUB_ENV"

      - name: Build
        shell: bash
        run: |
          for dir in examples/*/; do
            [ -d "$dir" ] || continue
            package="${dir%/}"
            package="${package##*/}"
        
            echo "Building $package..."
            cargo build -p "$package" --target ${{ matrix.target }}
          done