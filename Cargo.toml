[package]
name = "vyxen"
version = "0.2.0"
license = "MIT OR Apache-2.0"
edition = "2024"
rust-version = "1.86"
homepage = "https://github.com/GlowyDeveloper/Vyxen"
repository = "https://github.com/GlowyDeveloper/Vyxen"
keywords = ["game", "engine", "gamedev", "gui"]
categories = ["gui", "game-development", "game-engines", "graphics"]
description = "A Godot-style game engine library written in Rust."
readme = "README.md"

[lib]
name = "vyxen"
crate-type = ["lib", "cdylib", "staticlib"]

[workspace]
resolver = "3"
members = [
    ".",
    "testbed",
    "examples/ball-pit",
    "examples/counter",
    "examples/readme",
]

[workspace.package]
version = "0.2.0"
license = "MIT OR Apache-2.0"
edition = "2024"
rust-version = "1.86"

homepage = "https://github.com/GlowyDeveloper/Vyxen"
repository = "https://github.com/GlowyDeveloper/Vyxen"
keywords = ["game", "engine", "gamedev", "gui"]
categories = ["gui", "game-development", "game-engines", "graphics"]

[dependencies]
winit = { version = "0.30.13", features = ["android-native-activity"] }
wgpu = "30.0.1"
bytemuck = { version = "1.25.2", features = ["derive"] }

skrifa = "0.46.2"
zeno = "0.3.3"

zune-jpeg = { version = "0.5.15", default-features = false }
png = { version = "0.18.1", default-features = false, features = ["zlib-rs"] }

anyhow = "1.0.104"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-time = "1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
pollster = "1.0.1"
