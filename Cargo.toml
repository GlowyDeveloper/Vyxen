[package]
name = "vyxen"
version = "0.2.1"
license = "MIT OR Apache-2.0"
edition = "2024"
rust-version = "1.86"
homepage = "https://glowydeveloper.github.io/Vyxen/"
repository = "https://github.com/GlowyDeveloper/Vyxen"
keywords = ["game", "engine", "gamedev", "gui"]
categories = ["gui", "game-development", "game-engines", "graphics"]
description = "A Godot-style game engine library written in Rust."
readme = "README.md"

[lib]
name = "vyxen"
crate-type = ["lib", "cdylib", "staticlib"]

[workspace]
resolver = "3"
members = [
    ".",
    "testbed",
    "examples/ball-pit",
    "examples/counter",
    "examples/readme",
]

[dependencies]
winit = { version = "0.30.13", default-features = false, features = ["rwh_06"] }
bytemuck = { version = "1.25.2", features = ["derive"] }

skrifa = "0.47.0"
zeno = "0.3.3"

zune-jpeg = { version = "0.5.15", default-features = false }
png = { version = "0.18.1", default-features = false, features = ["zlib-rs"] }

log = "0.4.34"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2.128"
wasm-bindgen-futures = "0.4.78"
web-time = "1.1.0"
wgpu = { version = "30.0.1", features = ["webgl", "webgpu"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
pollster = "1.0.1"
wgpu = "30.0.1"

[target.'cfg(target_os = "linux")'.dependencies]
winit = { version = "0.30.13" }

[target.'cfg(target_os = "android")'.dependencies]
winit = { version = "0.30.13", default-features = false, features = ["android-native-activity"] }
